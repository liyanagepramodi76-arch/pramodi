
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password</title>

<link rel="stylesheet" href="css/login.css">

<link rel="stylesheet" 
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


<!-- ================= GOOGLE TRANSLATE HIDDEN CSS ================= -->

<style>

    /* Hide Google Translate element */
    #google_translate_element {
        display: none !important;
        visibility: hidden !important;
        width: 0 !important;
        height: 0 !important;
        overflow: hidden !important;
    }


    /* Hide Google Translate gadget */
    .goog-te-gadget {
        display: none !important;
    }


    /* Hide Google Translate top banner */
    .goog-te-banner-frame,
    .goog-te-banner-frame.skiptranslate,
    iframe.goog-te-banner-frame {
        display: none !important;
        visibility: hidden !important;
        height: 0 !important;
    }


    /* Prevent Google Translate from moving the page */
    body {
        top: 0 !important;
    }


    html {
        margin-top: 0 !important;
    }


    body > .skiptranslate {
        display: none !important;
    }


    /* ================= LANGUAGE BUTTONS ================= */

    .language-selector {

        position: fixed;

        top: 20px;

        right: 20px;

        z-index: 99999;

        display: flex !important;

        gap: 6px;

    }


    .language-selector button {

        border: none;

        background: #ffffff;

        color: #166534;

        font-family: Arial, sans-serif;

        font-size: 13px;

        font-weight: 700;

        padding: 8px 12px;

        border-radius: 8px;

        cursor: pointer;

        box-shadow:
            0 3px 10px rgba(0, 0, 0, 0.12);

        transition: all 0.3s ease;

    }


    .language-selector button:hover {

        background: #166534;

        color: #ffffff;

    }


    .language-selector button:active {

        transform: scale(0.96);

    }


    @media (max-width: 768px) {

        .language-selector {

            top: 12px;

            right: 12px;

        }


        .language-selector button {

            padding: 7px 9px;

            font-size: 12px;

        }

    }

</style>

</head>


<body>


<!-- ================= GOOGLE TRANSLATE ================= -->

<div id="google_translate_element"></div>


<!-- ================= LANGUAGE SELECTOR ================= -->

<div class="language-selector">

    <button
        type="button"
        onclick="changeLanguage('en')">

        EN

    </button>


    <button
        type="button"
        onclick="changeLanguage('si')">

        සිං

    </button>


    <button
        type="button"
        onclick="changeLanguage('ta')">

        த

    </button>

</div>



<div class="login-container">


<div class="login-card">


<div class="logo">

🌿 Rubber<span>Link</span>

</div>


<h2>Forgot Password?</h2>


<p class="subtitle">

Enter your email to reset your password

</p>



<form>


<div class="input-group forgot-input">


<i class="fa-solid fa-envelope left-icon"></i>


<input 
type="email"
placeholder="Email Address"
required>


</div>



<button class="login-btn">

Send Reset Link

</button>



</form>



<p class="register-link">

Remember your password?

<a href="login.html">

Back to Login

</a>


</p>



</div>


</div>



<!-- ================= GOOGLE TRANSLATE SCRIPT ================= -->

<script>

    function googleTranslateElementInit() {

        new google.translate.TranslateElement(

            {
                pageLanguage: 'en',

                includedLanguages: 'en,si,ta',

                autoDisplay: false
            },

            'google_translate_element'

        );

    }


    function changeLanguage(lang) {

        const select =
            document.querySelector('.goog-te-combo');


        if (select) {

            select.value = lang;

            select.dispatchEvent(
                new Event('change')
            );

        }

    }


    /* ================= HIDE GOOGLE TRANSLATE BAR ================= */

    function hideGoogleTranslateBar() {

        document.querySelectorAll(
            '.goog-te-banner-frame, ' +
            '.goog-te-banner-frame.skiptranslate'
        ).forEach(function(element) {

            element.style.display = 'none';

            element.style.visibility = 'hidden';

            element.style.height = '0';

        });


        document.body.style.top = '0px';

        document.documentElement.style.marginTop = '0px';


        document.querySelectorAll(
            'body > .skiptranslate'
        ).forEach(function(element) {

            element.style.display = 'none';

        });

    }


    /* Google Translate may inject the banner after loading */

    setInterval(

        hideGoogleTranslateBar,

        100

    );

</script>


<script
src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit">
</script>


</body>

</html>
