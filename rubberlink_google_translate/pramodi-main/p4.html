<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publish Rubber Stock | RubberLink</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f4fff4;
}

.navbar{
    background:#1b5e20;
}

.navbar-brand{
    color:white;
    font-size:28px;
    font-weight:bold;
}

.navbar-brand span{
    color:#FFD54F;
}

.main-section{
    padding:60px 20px;
}

.form-card{
    max-width:750px;
    margin:auto;
    background:white;
    border-radius:20px;
    padding:35px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.form-card h2{
    color:#1b5e20;
    text-align:center;
    margin-bottom:30px;
    font-weight:bold;
}

.form-label{
    font-weight:600;
}

.form-control,
.form-select,
textarea{
    border-radius:12px;
    border:1px solid #ccc;
    padding:12px;
}

.form-control:focus,
.form-select:focus,
textarea:focus{
    border-color:#2E7D32;
    box-shadow:0 0 8px rgba(46,125,50,.3);
}

.btn-publish{
    background:#2E7D32;
    color:white;
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
    transition:.3s;
}

.btn-publish:hover{
    background:#1b5e20;
}

.note{
    margin-top:15px;
    text-align:center;
    color:gray;
    font-size:14px;
}

.footer{
    margin-top:50px;
    text-align:center;
    padding:20px;
    background:#1b5e20;
    color:white;
}

@media(max-width:768px){

.form-card{
    padding:25px;
}

}


/* =====================================================
   GOOGLE TRANSLATE HIDDEN CSS
===================================================== */

#google_translate_element{

    display:none !important;

    visibility:hidden !important;

    width:0 !important;

    height:0 !important;

    overflow:hidden !important;

}

.goog-te-gadget{

    display:none !important;

}


/* Hide Google Translate top banner */

.goog-te-banner-frame,
.goog-te-banner-frame.skiptranslate,
iframe.goog-te-banner-frame{

    display:none !important;

    visibility:hidden !important;

    height:0 !important;

}


/* Prevent Google Translate from moving website */

body{

    top:0 !important;

}

html{

    margin-top:0 !important;

}

body > .skiptranslate{

    display:none !important;

}


/* =====================================================
   LANGUAGE BUTTONS
===================================================== */

.language-selector{

    position:fixed;

    top:20px;

    right:20px;

    z-index:99999;

    display:flex !important;

    gap:6px;

    align-items:center;

}


.language-selector button{

    border:none;

    background:#ffffff;

    color:#166534;

    font-family:Arial,sans-serif;

    font-size:13px;

    font-weight:700;

    padding:8px 12px;

    border-radius:8px;

    cursor:pointer;

    box-shadow:
        0 3px 10px rgba(0,0,0,.12);

    transition:all .3s ease;

}


.language-selector button:hover{

    background:#166534;

    color:#ffffff;

}


.language-selector button:active{

    transform:scale(.96);

}


@media(max-width:768px){

    .language-selector{

        top:12px;

        right:12px;

    }

    .language-selector button{

        padding:7px 9px;

        font-size:12px;

    }

}

</style>

</head>

<body>


<!-- =====================================================
     GOOGLE TRANSLATE ELEMENT
===================================================== -->

<div id="google_translate_element"></div>


<!-- =====================================================
     LANGUAGE SELECTOR
===================================================== -->

<div class="language-selector">

    <button
        type="button"
        onclick="changeLanguage('en')">

        EN

    </button>

    <button
        type="button"
        onclick="changeLanguage('si')">

        සිං

    </button>

    <button
        type="button"
        onclick="changeLanguage('ta')">

        த

    </button>

</div>


<nav class="navbar navbar-expand-lg">
<div class="container">

<a class="navbar-brand" href="#">
🌿 Rubber<span>Link</span>
</a>

</div>
</nav>


<section class="main-section">

<div class="form-card">

<h2>Publish Your Rubber Stock</h2>

<form>

<div class="mb-3">
<label class="form-label">Rubber Type</label>

<select class="form-select">
<option selected>Select Rubber Type</option>
<option>RSS 1</option>
<option>RSS 2</option>
<option>RSS 3</option>
<option>RSS 4</option>
<option>RSS 5</option>
<option>Latex</option>
<option>Crepe Rubber</option>
</select>

</div>


<div class="mb-3">

<label class="form-label">
Available Quantity (Kg)
</label>

<input type="number"
class="form-control"
placeholder="Enter Quantity">

</div>


<div class="mb-3">

<label class="form-label">
Price per Kg (LKR)
</label>

<input type="number"
class="form-control"
placeholder="Enter Price">

</div>


<div class="mb-3">

<label class="form-label">
Harvest Date
</label>

<input type="date"
class="form-control">

</div>


<div class="mb-3">

<label class="form-label">
Description
</label>

<textarea
rows="5"
class="form-control"
placeholder="Write additional details..."></textarea>

</div>


<button class="btn-publish">
Publish Stock
</button>


<p class="note">
Your published stock will be visible to buyers.
</p>

</form>

</div>

</section>


<footer class="footer">

© 2026 RubberLink | Connecting Farmers & Buyers

</footer>


<!-- =====================================================
     GOOGLE TRANSLATE JAVASCRIPT
===================================================== -->

<script>

function googleTranslateElementInit(){

    new google.translate.TranslateElement(

        {

            pageLanguage:'en',

            includedLanguages:'en,si,ta',

            autoDisplay:false

        },

        'google_translate_element'

    );

}


/* =====================================================
   CHANGE LANGUAGE
===================================================== */

function changeLanguage(lang){

    const select =
        document.querySelector('.goog-te-combo');

    if(select){

        select.value=lang;

        select.dispatchEvent(
            new Event('change')
        );

    }

}


/* =====================================================
   HIDE GOOGLE TRANSLATE BAR
===================================================== */

function hideGoogleTranslateBar(){

    document.querySelectorAll(

        '.goog-te-banner-frame, ' +
        '.goog-te-banner-frame.skiptranslate'

    ).forEach(function(element){

        element.style.display='none';

        element.style.visibility='hidden';

        element.style.height='0';

    });


    document.body.style.top='0px';

    document.documentElement.style.marginTop='0px';


    document.querySelectorAll(

        'body > .skiptranslate'

    ).forEach(function(element){

        element.style.display='none';

    });

}


/* Google Translate can inject
   the banner after page loading */

setInterval(

    hideGoogleTranslateBar,

    100

);

</script>


<!-- =====================================================
     GOOGLE TRANSLATE API
===================================================== -->

<script
src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit">
</script>


</body>
</html>
