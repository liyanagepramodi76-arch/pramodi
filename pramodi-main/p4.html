<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publish Rubber Stock | RubberLink</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            background:#f4fff4;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .site-logo {
            width: 58px;
            height: 58px;
            object-fit: contain;
            display: block;
        }

        .brand-name {
            font-family: 'Outfit', sans-serif;
            font-size: 27px;
            font-weight: 800;
            color: var(--dark);
        }

        .brand-name span {
            color: var(--primary-green);
        }

        .navbar{
            background:#1b5e20;
        }

        .navbar-brand{
            color:white;
            font-size:28px;
            font-weight:bold;
        }

        .navbar-brand span{
            color:#FFD54F;
        }

        .main-section{
            padding:60px 20px;
        }

        .form-card{
            max-width:750px;
            margin:auto;
            background:white;
            border-radius:20px;
            padding:35px;
            box-shadow:0 10px 30px rgba(0,0,0,.15);
        }

        .form-card h2{
            color:#1b5e20;
            text-align:center;
            margin-bottom:30px;
            font-weight:bold;
        }

        .form-label{
            font-weight:600;
        }

        .form-control,
        .form-select,
        textarea{
            border-radius:12px;
            border:1px solid #ccc;
            padding:12px;
        }

        .form-control:focus,
        .form-select:focus,
        textarea:focus{
            border-color:#2E7D32;
            box-shadow:0 0 8px rgba(46,125,50,.3);
        }

        .btn-publish{
            background:#2E7D32;
            color:white;
            width:100%;
            padding:14px;
            border:none;
            border-radius:12px;
            font-size:18px;
            font-weight:bold;
            transition:.3s;
        }

        .btn-publish:hover{
            background:#1b5e20;
        }

        .note{
            margin-top:15px;
            text-align:center;
            color:gray;
            font-size:14px;
        }

        .footer{
            margin-top:50px;
            text-align:center;
            padding:20px;
            background:#1b5e20;
            color:white;
        }

        @media(max-width:768px){

        .form-card{
            padding:25px;
        }

        }

        .navbar-nav {
            gap: 8px;
        }

        .nav-link {
            color: #f5f7f6 !important;
            font-weight: 500;
            padding: 10px 16px !important;
            transition: 0.3s;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--primary-green) !important;
        }

        .nav-buttons {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ================= P4 DARK MODE ================= */

body.dark-mode {
    background: #0f172a;
    color: #f8fafc;
}


/* Dark mode button */

.dark-mode-btn {
    position: fixed;
    top: 20px;
    right: 25px;
    width: 45px;
    height: 45px;
    border: none;
    border-radius: 50%;
    background: #ffffff;
    color: #166534;
    font-size: 20px;
    cursor: pointer;
    z-index: 9999;
    box-shadow: 0 5px 15px rgba(0,0,0,.15);
    transition: .3s;
}

.dark-mode-btn:hover {
    transform: translateY(-2px);
    background: #166534;
    color: white;
}


/* Navbar */

body.dark-mode .navbar {
    background: #111827 !important;
}

body.dark-mode .navbar-brand {
    color: #ffffff;
}

body.dark-mode .navbar-brand span {
    color: #4ade80;
}

body.dark-mode .nav-link {
    color: #e2e8f0 !important;
}

body.dark-mode .nav-link:hover,
body.dark-mode .nav-link.active {
    color: #4ade80 !important;
}


/* Main background */

body.dark-mode .main-section {
    background: #0f172a;
}


/* Form card */

body.dark-mode .form-card {
    background: #1e293b !important;
    color: #f8fafc;
    border: 1px solid #334155;
    box-shadow: 0 15px 45px rgba(0,0,0,.35);
}


/* Form heading */

body.dark-mode .form-card h2 {
    color: #4ade80;
}


/* Labels */

body.dark-mode .form-label {
    color: #e2e8f0;
}


/* Inputs */

body.dark-mode .form-card .form-control,
body.dark-mode .form-card .form-select,
body.dark-mode .form-card textarea {
    background: #273549 !important;
    color: #ffffff !important;
    border-color: #475569 !important;
}


/* Placeholder */

body.dark-mode .form-card .form-control::placeholder,
body.dark-mode .form-card textarea::placeholder {
    color: #94a3b8;
}


/* Focus */

body.dark-mode .form-card .form-control:focus,
body.dark-mode .form-card .form-select:focus,
body.dark-mode .form-card textarea:focus {
    background: #273549 !important;
    color: #ffffff !important;
    border-color: #22c55e !important;
    box-shadow: 0 0 0 4px rgba(34,197,94,.15);
}


/* Note */

body.dark-mode .note {
    color: #94a3b8;
}


/* Footer */

body.dark-mode .footer {
    background: #020617;
    color: #e2e8f0;
}


/* Publish button */

body.dark-mode .btn-publish {
    background: #22c55e;
    color: #052e16;
}

body.dark-mode .btn-publish:hover {
    background: #16a34a;
    color: #ffffff;
}


/* Dark mode button itself */

body.dark-mode .dark-mode-btn {
    background: #1e293b;
    color: #facc15;
    box-shadow: 0 5px 15px rgba(0,0,0,.3);
}

body.dark-mode .dark-mode-btn:hover {
    background: #334155;
    color: #facc15;
}

/* ================= TOP BUTTONS ================= */

.top-icons {
    position: fixed;
    top: 20px;
    left: 25px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 99999;
}


/* Home Button */

.back-home-btn {
    height: 45px;
    padding: 0 18px;
    border-radius: 25px;
    background: #166534;
    color: white;
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    box-shadow: 0 10px 25px rgba(22,101,52,.25);
    transition: .3s;
}

.back-home-btn:hover {
    background: #14532d;
    color: white;
    transform: translateY(-2px);
}


/* Dark Mode Button */

.dark-mode-btn {
    width: 45px;
    height: 45px;
    padding: 0;

    border: none;
    border-radius: 50%;

    background: white;
    color: #166534;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 20px;
    cursor: pointer;

    box-shadow: 0 5px 15px rgba(0,0,0,.15);

    transition: .3s;
}

.dark-mode-btn:hover {
    background: #166534;
    color: white;
    transform: translateY(-2px);
}


/* Dark Mode */

body.dark-mode .back-home-btn {
    background: #22c55e;
    color: #052e16;
}

body.dark-mode .back-home-btn:hover {
    background: #16a34a;
    color: white;
}

body.dark-mode .dark-mode-btn {
    background: #1e293b;
    color: #facc15;
}

body.dark-mode .dark-mode-btn:hover {
    background: #334155;
    color: #facc15;
}
</style>

</head>
<body>
<!-- DARK MODE BUTTON -->
<!-- TOP BUTTONS -->

<nav class="navbar navbar-expand-lg">
<div class="container">

<a class="navbar-brand" href="#">
                        <img src="img/Ruboralogo.png"
                alt="Rubora Logo"
                class="site-logo">

            <span class="brand-name">
                <span>Rubora</span>
            </span>
</a>


</div>
</nav>

<section class="main-section">

<div class="form-card">

<h2>Publish Your Rubber Stock</h2>

<form>

<div class="mb-3">
<label class="form-label">Rubber Type</label>

<select class="form-select">
<option selected>Select Rubber Type</option>
<option>RSS 1</option>
<option>RSS 2</option>
<option>RSS 3</option>
<option>RSS 4</option>
<option>RSS 5</option>
<option>Latex</option>
<option>Crepe Rubber</option>
</select>

</div>

<div class="mb-3">

<label class="form-label">
Available Quantity (Kg)
</label>

<input type="number"
class="form-control"
placeholder="Enter Quantity">

</div>

<div class="mb-3">

<label class="form-label">
Price per Kg (LKR)
</label>

<input type="number"
class="form-control"
placeholder="Enter Price">

</div>

<div class="mb-3">

<label class="form-label">
Harvest Date
</label>

<input type="date"
class="form-control">

</div>

<div class="mb-3">

<label class="form-label">
Description
</label>

<textarea
rows="5"
class="form-control"
placeholder="Write additional details..."></textarea>

</div>

<button class="btn-publish">
Publish Stock
</button>

<p class="note">
Your published stock will be visible to buyers.
</p>

</form>

</div>

</section>

<footer class="footer">

© 2026 RubberLink | Connecting Farmers & Buyers

</footer>
    <script src="js/darkmode.js"></script>
</body>
</html>
