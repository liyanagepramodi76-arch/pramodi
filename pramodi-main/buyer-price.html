<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Publish Buying Price</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
rel="stylesheet">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- Main CSS -->
<link rel="stylesheet" href="css/style.css">

</head>

<body>

<!-- TOP BAR -->

<div class="top-icons">

    <a href="index.html" class="back-home-btn">

        <i class="bi bi-arrow-left"></i>

        Back Home

    </a>

    <button id="darkModeToggle" class="dark-mode-btn">

        <i class="bi bi-moon-stars-fill"></i>

    </button>

</div>


<div class="buyer-wrapper">

    <!-- LEFT SIDE -->

    <div class="buyer-info">

        <span class="section-label">

            RUBBERLINK BUYER

        </span>

        <h1>

            Publish Today's

            <span>Buying Price</span>

        </h1>

        <p>

            Publish your latest buying price so rubber farmers
            can compare offers and contact your company easily.

        </p>

        <div class="benefits">

            <div class="benefit">
                <i class="bi bi-check-circle-fill"></i>
                Reach more farmers instantly
            </div>

            <div class="benefit">
                <i class="bi bi-check-circle-fill"></i>
                Update prices anytime
            </div>

            <div class="benefit">
                <i class="bi bi-check-circle-fill"></i>
                Securely stored in Firebase
            </div>

        </div>

    </div>

    <!-- RIGHT SIDE -->

    <div class="price-form-card">

        <div class="calculator-header">

            <div class="calculator-icon">

                <i class="bi bi-cash-coin"></i>

            </div>

            <div>

                <h2>Publish Price</h2>

                <p>Enter your buying details</p>

            </div>

        </div>

<script type="module" src="js/buyer-price.js"></script>
<script type="module" src="js/logout.js"></script>
</body>
</html>
