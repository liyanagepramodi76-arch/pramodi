<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Compare Buyer Prices | RubberLink</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;700;800&display=swap"
        rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

        <link href="https://unpkg.com/aos@2.3.1/dist/aos.css"
rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<!-- Navbar -->

    <nav class="navbar navbar-expand-lg fixed-top custom-navbar">

        <div class="container">

           <a class="navbar-brand logo notranslate" translate="no" href="index.html">
    <img src="img/Ruboralogo.png" alt="Rubora Logo" class="site-logo">
    <span class="brand-name notranslate" translate="no">Rubora</span>
</a>

            <button id="darkModeToggle" class="dark-mode-btn">
                <i class="bi bi-moon-stars-fill"></i>
            </button>

            <div class="nav-buttons ms-auto">


                <a href="index.html" class="btn register-btn">
                    <i class="bi bi-arrow-left"></i> Back Home
                </a>

            </div>
        </div>

    </nav>

    <!-- Header -->

        <section class="compare-hero">


        <div class="container text-center">


        <span class="small-badge">

        <span class="pulse-dot"></span>

        Smart Price Comparison

        </span>


        <h1>

        Find The 

        <span class="gradient-text">

        Best Rubber Buyers

        </span>

        Near You

        </h1>


        <p>

        Compare buyer prices, check availability,
        and connect with companies offering better prices.

        </p>


        </div>


        </section>

    <!-- Price Cards -->

    <section class="price-section">

        <div class="container">

            <div class="filter-panel">

                <div class="row g-3">

                <!-- Search -->

                <div class="col-lg-4">

                    <input
                        type="text"
                        id="searchBuyer"
                        class="form-control"
                        placeholder="🔍 Search Buyer">

                </div>


                    <div class="col-lg-4">

                        <input
                        type="number"
                        id="searchPrice"
                        class="form-control"
                        placeholder="🔍 Search Price">

                    </div>

                    <!-- District Filter -->

                    <div class="col-lg-4">

                        <select
                            id="districtFilter"
                            class="form-select">

                            <option value="all">
                                All Districts
                            </option>

                            <option value="Ampara">Ampara</option>
                            <option value="Anuradhapura">Anuradhapura</option>
                            <option value="Badulla">Badulla</option>
                            <option value="Batticaloa">Batticaloa</option>
                            <option value="Colombo">Colombo</option>
                            <option value="Galle">Galle</option>
                            <option value="Gampaha">Gampaha</option>
                            <option value="Hambantota">Hambantota</option>
                            <option value="Jaffna">Jaffna</option>
                            <option value="Kalutara">Kalutara</option>
                            <option value="Kandy">Kandy</option>
                            <option value="Kegalle">Kegalle</option>
                            <option value="Kilinochchi">Kilinochchi</option>
                            <option value="Kurunegala">Kurunegala</option>
                            <option value="Mannar">Mannar</option>
                            <option value="Matale">Matale</option>
                            <option value="Matara">Matara</option>
                            <option value="Monaragala">Monaragala</option>
                            <option value="Mullaitivu">Mullaitivu</option>
                            <option value="Nuwara Eliya">Nuwara Eliya</option>
                            <option value="Polonnaruwa">Polonnaruwa</option>
                            <option value="Puttalam">Puttalam</option>
                            <option value="Ratnapura">Ratnapura</option>
                            <option value="Trincomalee">Trincomalee</option>
                            <option value="Vavuniya">Vavuniya</option>

                        </select>

                    </div>

                </div>


                        <div class="row g-4" id="buyerPriceContainer">

    <!-- Firebase buyer price cards will appear here -->

    <div class="col-12 text-center" id="loadingMessage">
        <div class="py-5">
            <i class="bi bi-arrow-repeat fs-2"></i>
            <p class="mt-2">Loading buyer prices...</p>
        </div>
    </div>

</div>

            </div>
        </div>

    </section>

                            <!-- REQUEST MODAL -->

        <div class="modal" id="requestModal">


        <div class="modal-content">


        <div class="modal-header">

        <h2>
        Send Request
        </h2>


        <button class="close-btn"
        onclick="closeRequest()">

        &times;

        </button>


        </div>


        <p>

        Send a request to:

        <strong id="buyerName"></strong>

        </p>



        <div class="form-group">

        <label>
        Rubber Quantity (kg)
        </label>


        <input 
        type="number"
        id="quantity"
        placeholder="Example: 300">

        </div>



        <div class="form-group">

        <label>
        Offered Price (Rs/kg)
        </label>


        <input 
        type="number"
        id="price"
        placeholder="Example: 550">

        </div>



        <div class="form-group">

        <label>
        Message
        </label>


        <textarea
        id="message"
        placeholder="Write your message...">

        </textarea>


        </div>



        <button class="send-btn"
        onclick="sendRequest()">


        <i class="bi bi-send-fill"></i>

        Send Request


        </button>



        <div class="success-message"
        id="successMessage">

        ✅ Request sent successfully!

        </div>



        </div>


        </div>


        <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>


        <script>

        AOS.init({

        duration:900,
        once:true

        });

        </script>
        <script type="module" src="js/compare.js"></script>
        <script src="js/darkmode.js"></script>
        <script src="js/google-translate.js"></script>
</body>
    

</html>
